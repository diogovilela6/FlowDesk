<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FlowDesk</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Inter',system-ui,sans-serif}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
.no-select{user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useRef, useEffect} = React;

// ── Icon set ──
const Ic = (paths) => ({size=18,className=""})=> (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{paths}</svg>
);
const Icons = {
  Dashboard:   Ic(<><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></>),
  Tasks:       Ic(<><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></>),
  Sun:         Ic(<><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></>),
  FileText:    Ic(<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></>),
  Settings:    Ic(<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></>),
  Search:      Ic(<><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>),
  Plus:        Ic(<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>),
  ChevronLeft: Ic(<polyline points="15 18 9 12 15 6"/>),
  ChevronRight:Ic(<polyline points="9 18 15 12 9 6"/>),
  X:           Ic(<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>),
  Star:        Ic(<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>),
  Trash2:      Ic(<><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></>),
  AlertCircle: Ic(<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>),
  Clock:       Ic(<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>),
  Filter:      Ic(<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>),
  Circle:      Ic(<circle cx="12" cy="12" r="10"/>),
  CheckCircle2:Ic(<><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></>),
  Zap:         Ic(<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>),
  Coffee:      Ic(<><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></>),
  BookOpen:    Ic(<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>),
  Edit3:       Ic(<><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></>),
  Calendar:    Ic(<><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>),
  TrendingUp:  Ic(<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>),
};

// ── Constants ──
const PRIORITIES = ["Low","Medium","High","Urgent"];
const PRIORITY_COLOR = {Low:"bg-slate-100 text-slate-600",Medium:"bg-blue-100 text-blue-700",High:"bg-orange-100 text-orange-700",Urgent:"bg-red-100 text-red-700"};
const PRIORITY_DOT = {Low:"bg-slate-400",Medium:"bg-blue-500",High:"bg-orange-500",Urgent:"bg-red-500"};
const STATUS_OPTS = ["To Do","In Progress","Waiting","Done"];
const CATEGORIES = ["Work","Personal","Design","Dev","Marketing","Health"];
const PROJ_COLORS = ["bg-violet-500","bg-blue-500","bg-emerald-500","bg-orange-500","bg-pink-500","bg-teal-500","bg-red-500","bg-amber-500"];
const HOURS = Array.from({length:17},(_,i)=>`${String(i+8).padStart(2,"0")}:00`);
const SLOT_H = 64;

const today = new Date();
const fmt = d => d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const fmtS = d => d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const ds = d => d.toISOString().split("T")[0];
const todayStr = ds(today);
const tomorrowStr = ds(addDays(today,1));

function mkDk(isDark) {
  const d = isDark;
  return {
    d,
    bg:      d?"bg-slate-950":"bg-slate-50",
    surface: d?"bg-slate-900":"bg-white",
    border:  d?"border-slate-700":"border-slate-100",
    textPri: d?"text-slate-100":"text-slate-800",
    textSec: d?"text-slate-400":"text-slate-500",
    textMut: d?"text-slate-500":"text-slate-400",
    hov:     d?"hover:bg-slate-800":"hover:bg-slate-50",
    navAct:  d?"bg-indigo-950 text-indigo-300":"bg-indigo-50 text-indigo-700",
    navInact:d?"text-slate-400 hover:bg-slate-800 hover:text-slate-200":"text-slate-500 hover:bg-slate-50 hover:text-slate-700",
  };
}

// ── App ──
function App() {
  const load = (key, fallback) => { try { const v=localStorage.getItem(key); return v?JSON.parse(v):fallback; } catch{ return fallback; } };
  const save = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch{} };

  const [section, setSection]   = useState("dashboard");
  const [tasks, setTasks]       = useState(()=>load("fd_tasks",[]));
  const [projects, setProjects] = useState(()=>load("fd_projects",[]));
  const [notes, setNotes]       = useState(()=>load("fd_notes",[]));
  const [selNote, setSelNote]   = useState(null);
  const [dismissed, setDismissed] = useState([]);
  const [showTask, setShowTask] = useState(false);
  const [editTask, setEditTask] = useState(null);
  const [showProj, setShowProj] = useState(false);
  const [editProj, setEditProj] = useState(null);
  const [searchQ, setSearchQ]   = useState("");
  const [filterP, setFilterP]   = useState("All");
  const [calDate, setCalDate]   = useState(new Date(today));
  const [dashExp, setDashExp]   = useState(null);
  const [theme, setTheme]       = useState(()=>load("fd_theme","Light"));
  const [userName, setUserName] = useState(()=>load("fd_name","Sofia"));

  useEffect(()=>save("fd_tasks",tasks),[tasks]);
  useEffect(()=>save("fd_projects",projects),[projects]);
  useEffect(()=>save("fd_notes",notes),[notes]);
  useEffect(()=>save("fd_theme",theme),[theme]);
  useEffect(()=>save("fd_name",userName),[userName]);

  const isDark = theme==="Dark"||(theme==="System"&&window.matchMedia?.("(prefers-color-scheme:dark)").matches);
  const dk = mkDk(isDark);
  const calStr = ds(calDate);

  const overdue     = tasks.filter(t=>t.deadline<todayStr&&!t.done);
  const dueToday    = tasks.filter(t=>t.deadline===todayStr&&!t.done);
  const dueTomorrow = tasks.filter(t=>t.deadline===tomorrowStr&&!t.done);
  const dueWeek     = tasks.filter(t=>t.deadline>tomorrowStr&&t.deadline<=ds(addDays(today,7))&&!t.done);
  const alerts      = [...overdue,...dueToday.filter(t=>t.priority==="Urgent"||t.priority==="High")].filter(t=>!dismissed.includes(t.id)).slice(0,4);
  const compToday   = tasks.filter(t=>t.done&&t.deadline===todayStr).length;
  const totToday    = tasks.filter(t=>t.deadline===todayStr).length;
  const pct         = totToday?Math.round(compToday/totToday*100):0;

  const saveTask = data => {
    if(editTask && !editTask._new) setTasks(ts=>ts.map(t=>t.id===editTask.id?{...t,...data,done:data.status==="Done"}:t));
    else setTasks(ts=>[...ts,{id:Date.now(),...data,done:data.status==="Done"}]);
    setShowTask(false); setEditTask(null);
  };
  const toggleDone = id => setTasks(ts=>ts.map(t=>t.id===id?{...t,done:!t.done,status:!t.done?"Done":t.status==="Done"?"To Do":t.status}:t));
  const deleteTask = id => setTasks(ts=>ts.filter(t=>t.id!==id));
  const moveTask   = (tid,pid) => setTasks(ts=>ts.map(t=>t.id===tid?{...t,project:pid}:t));
  const updateTaskTime = (tid, hour) => setTasks(ts=>ts.map(t=>t.id===tid?{...t,time:hour,deadline:calStr}:t));
  const updateTaskDuration = (tid, dur) => setTasks(ts=>ts.map(t=>t.id===tid?{...t,duration:dur}:t));
  const unscheduleTask = tid => setTasks(ts=>ts.map(t=>t.id===tid?{...t,time:""}:t));

  const saveProject = (name,colorIdx) => {
    if(editProj) setProjects(ps=>ps.map(p=>p.id===editProj.id?{...p,name,colorIdx}:p));
    else setProjects(ps=>[...ps,{id:"p"+Date.now(),name,colorIdx}]);
    setShowProj(false); setEditProj(null);
  };
  const deleteProject = pid => { setProjects(ps=>ps.filter(p=>p.id!==pid)); setTasks(ts=>ts.map(t=>t.project===pid?{...t,project:null}:t)); };

  const addNote = () => { const n={id:Date.now(),title:"Untitled Note",fav:false,content:[{type:"h2",text:"Untitled Note"},{type:"p",text:"Start writing..."}]}; setNotes(ns=>[n,...ns]); setSelNote(n.id); };
  const deleteNote = id => { setNotes(ns=>ns.filter(n=>n.id!==id)); if(selNote===id) setSelNote(null); };

  const filteredTasks = tasks.filter(t=>{
    const q=searchQ.toLowerCase();
    if(q&&!t.title.toLowerCase().includes(q)&&!t.desc?.toLowerCase().includes(q)) return false;
    if(filterP!=="All"&&t.priority!==filterP) return false;
    return true;
  });

  const nav = [
    {id:"dashboard",Icon:Icons.Dashboard,label:"Dashboard"},
    {id:"tasks",    Icon:Icons.Tasks,    label:"Tasks"},
    {id:"myday",    Icon:Icons.Sun,      label:"My Day"},
    {id:"notes",    Icon:Icons.FileText, label:"Notes"},
    {id:"settings", Icon:Icons.Settings, label:"Settings"},
  ];

  return (
    <div className={`flex h-screen ${dk.bg} overflow-hidden`} style={{height:"100vh"}}>
      <aside className={`w-56 ${dk.surface} border-r ${dk.border} flex flex-col py-5 px-3 shrink-0`}>
        <div className="flex items-center gap-2 px-3 mb-8">
          <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-violet-500 to-indigo-600 flex items-center justify-center">
            <Icons.Zap size={14} className="text-white"/>
          </div>
          <span className={`font-bold text-sm tracking-tight ${dk.textPri}`}>FlowDesk</span>
        </div>
        <nav className="flex flex-col gap-1 flex-1">
          {nav.map(({id,Icon,label})=>(
            <button key={id} onClick={()=>setSection(id)}
              className={`flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${section===id?dk.navAct:dk.navInact}`}>
              <Icon size={17}/>{label}
              {id==="tasks"&&overdue.length>0&&<span className="ml-auto bg-red-500 text-white text-xs rounded-full px-1.5 py-0.5 leading-none">{overdue.length}</span>}
            </button>
          ))}
        </nav>
        <div className="px-3 mt-4">
          <div className={`flex items-center gap-2 p-2 rounded-xl ${dk.d?"bg-slate-800":"bg-slate-50"}`}>
            <div className="w-7 h-7 rounded-full bg-gradient-to-br from-pink-400 to-violet-500 flex items-center justify-center text-white text-xs font-bold">{userName.charAt(0).toUpperCase()}</div>
            <div><div className={`text-xs font-semibold ${dk.textPri}`}>{userName}</div><div className={`text-xs ${dk.textMut}`}>Pro</div></div>
          </div>
        </div>
      </aside>

      <div className="flex-1 flex flex-col overflow-hidden">
        <header className={`h-14 ${dk.surface} border-b ${dk.border} flex items-center px-5 gap-4 shrink-0`}>
          <div className={`flex items-center gap-2 rounded-xl px-3 py-2 flex-1 max-w-sm ${dk.d?"bg-slate-800":"bg-slate-50"}`}>
            <Icons.Search size={15} className={dk.textMut}/>
            <input value={searchQ} onChange={e=>setSearchQ(e.target.value)} placeholder="Search tasks and notes…"
              className={`bg-transparent text-sm outline-none w-full ${dk.d?"text-slate-100 placeholder-slate-500":"text-slate-700 placeholder-slate-400"}`}/>
          </div>
          <span className={`text-sm font-medium ml-2 ${dk.textMut}`}>{fmt(today)}</span>
          <button onClick={()=>{setEditTask({_new:true});setShowTask(true);}} className="ml-auto flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-xl transition-colors">
            <Icons.Plus size={15}/>Add Task
          </button>
        </header>
        <main className="flex-1 overflow-auto">
          {section==="dashboard"&&<Dashboard overdue={overdue} dueToday={dueToday} dueTomorrow={dueTomorrow} dueWeek={dueWeek} alerts={alerts} dismissed={dismissed} setDismissed={setDismissed} pct={pct} compToday={compToday} totToday={totToday} notes={notes} setSection={setSection} dashExp={dashExp} setDashExp={setDashExp} toggleDone={toggleDone} projects={projects} userName={userName} dk={dk}/>}
          {section==="tasks"&&<TaskBoard tasks={filteredTasks} allTasks={tasks} setTasks={setTasks} projects={projects} filterP={filterP} setFilterP={setFilterP} moveTask={moveTask} toggleDone={toggleDone} deleteTask={deleteTask} setEditTask={t=>{setEditTask(t);setShowTask(true);}} deleteProject={deleteProject} setEditProject={p=>{setEditProj(p);setShowProj(true);}} setShowProj={setShowProj} dk={dk}/>}
          {section==="myday"&&<MyDay tasks={tasks} setTasks={setTasks} calDate={calDate} setCalDate={setCalDate} calStr={calStr} updateTaskTime={updateTaskTime} updateTaskDuration={updateTaskDuration} unscheduleTask={unscheduleTask} projects={projects} toggleDone={toggleDone} setEditTask={t=>{setEditTask(t);setShowTask(true);}} dk={dk}/>}
          {section==="notes"&&<Notes notes={notes} selNote={selNote} setSelNote={setSelNote} addNote={addNote} deleteNote={deleteNote} toggleFav={id=>setNotes(ns=>ns.map(n=>n.id===id?{...n,fav:!n.fav}:n))} setNotes={setNotes} dk={dk}/>}
          {section==="settings"&&<SettingsPage theme={theme} setTheme={setTheme} userName={userName} setUserName={setUserName} dk={dk}/>}
        </main>
      </div>

      {showTask&&<TaskModal task={editTask} projects={projects} onSave={saveTask} onClose={()=>{setShowTask(false);setEditTask(null);}} dk={dk}/>}
      {showProj&&<ProjectModal project={editProj} onSave={saveProject} onClose={()=>{setShowProj(false);setEditProj(null);}} dk={dk}/>}
    </div>
  );
}

// ── Dashboard ──
function Dashboard({overdue,dueToday,dueTomorrow,dueWeek,alerts,dismissed,setDismissed,pct,compToday,totToday,notes,setSection,dashExp,setDashExp,toggleDone,projects,userName,dk}) {
  const {d,surface,border,textPri,textSec,textMut,hov} = dk;
  const note = notes[0];
  const cards = [
    {key:"overdue",  label:"Overdue",       val:overdue.length,     Icon:Icons.AlertCircle, bg:"bg-red-50",    tc:"text-red-600",    list:overdue,     ac:"text-red-500"},
    {key:"today",    label:"Due Today",     val:dueToday.length,    Icon:Icons.Calendar,    bg:"bg-blue-50",   tc:"text-blue-600",   list:dueToday,    ac:"text-blue-500"},
    {key:"tomorrow", label:"Due Tomorrow",  val:dueTomorrow.length, Icon:Icons.Clock,       bg:"bg-amber-50",  tc:"text-amber-600",  list:dueTomorrow, ac:"text-amber-500"},
    {key:"week",     label:"Due This Week", val:dueWeek.length,     Icon:Icons.TrendingUp,  bg:"bg-violet-50", tc:"text-violet-600", list:dueWeek,     ac:"text-violet-500"},
  ];
  return (
    <div className="p-7 max-w-6xl mx-auto">
      <div className="mb-7">
        <h1 className={`text-2xl font-bold ${textPri}`}>Good morning, {userName} 👋</h1>
        <p className={`mt-1 text-sm ${textSec}`}>Here's what needs your attention today.</p>
      </div>
      <div className="grid grid-cols-4 gap-4 mb-6">
        {cards.map(({key,label,val,Icon,bg,tc,ac})=>(
          <button key={key} onClick={()=>setDashExp(dashExp===key?null:key)}
            className={`${surface} rounded-2xl p-5 border text-left transition-all hover:shadow-md ${dashExp===key?`border-indigo-300 ring-2 ring-indigo-100 shadow-md`:`${border} shadow-sm`}`}>
            <div className={`w-9 h-9 rounded-xl ${d?"bg-slate-800":bg} flex items-center justify-center mb-3`}><Icon size={18} className={d?"text-slate-300":tc}/></div>
            <div className={`text-2xl font-bold ${textPri}`}>{val}</div>
            <div className={`text-xs mt-0.5 font-medium ${textSec}`}>{label}</div>
            {val>0&&<div className={`text-xs mt-2 font-semibold ${d?"text-indigo-400":ac}`}>{dashExp===key?"Hide ↑":"View all →"}</div>}
          </button>
        ))}
      </div>
      {dashExp&&(()=>{
        const card=cards.find(c=>c.key===dashExp);
        return(
          <div className={`${surface} rounded-2xl border ${border} shadow-sm mb-6 overflow-hidden`}>
            <div className={`flex items-center justify-between px-5 py-4 border-b ${border}`}>
              <h2 className={`font-semibold text-sm ${textPri}`}>{card.label} · {card.list.length} tasks</h2>
              <button onClick={()=>setDashExp(null)} className={textMut}><Icons.X size={16}/></button>
            </div>
            {card.list.length===0
              ?<div className={`py-10 text-center text-sm ${textSec}`}>No tasks here 🎉</div>
              :<div className={`divide-y ${d?"divide-slate-700":"divide-slate-50"}`}>
                {card.list.map(t=>{
                  const proj=projects.find(p=>p.id===t.project);
                  return(
                    <div key={t.id} className={`flex items-center gap-3 px-5 py-3 ${hov} transition-colors`}>
                      <button onClick={()=>toggleDone(t.id)} className="text-slate-300 hover:text-emerald-500 shrink-0">{t.done?<Icons.CheckCircle2 size={16} className="text-emerald-500"/>:<Icons.Circle size={16}/>}</button>
                      <div className="flex-1 min-w-0">
                        <div className={`text-sm font-medium truncate ${textPri}`}>{t.title}</div>
                        {t.desc&&<div className={`text-xs truncate ${textMut}`}>{t.desc}</div>}
                      </div>
                      <div className="flex items-center gap-2 shrink-0">
                        {proj&&<span className={`text-xs px-2 py-0.5 rounded-full text-white font-medium ${PROJ_COLORS[proj.colorIdx%PROJ_COLORS.length]}`}>{proj.name}</span>}
                        <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${PRIORITY_COLOR[t.priority]}`}>{t.priority}</span>
                        <span className={`text-xs ${textMut}`}>{fmtS(new Date(t.deadline+"T00:00:00"))}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            }
          </div>
        );
      })()}
      <div className="grid grid-cols-3 gap-5">
        <div className="col-span-2">
          <div className="flex items-center justify-between mb-3">
            <h2 className={`font-semibold text-sm ${textPri}`}>Priority Alerts</h2>
            <span className={`text-xs ${textMut}`}>{alerts.length} active</span>
          </div>
          {alerts.length===0
            ?<div className={`${surface} rounded-2xl border ${border} p-8 text-center`}>
              <Icons.CheckCircle2 size={28} className="text-emerald-400 mx-auto mb-2"/>
              <p className={`text-sm font-medium ${textPri}`}>You're all caught up!</p>
              <p className={`text-xs mt-1 ${textMut}`}>No urgent tasks right now.</p>
            </div>
            :<div className="flex flex-col gap-3">
              {alerts.map(t=>(
                <div key={t.id} className={`border-l-4 ${{Urgent:"border-l-red-500",High:"border-l-orange-400",Medium:"border-l-blue-400",Low:"border-l-slate-300"}[t.priority]} ${d?"bg-slate-800":"bg-slate-50"} rounded-r-2xl p-4 flex items-start justify-between`}>
                  <div>
                    <div className="flex items-center gap-2 mb-0.5">
                      <span className={`text-xs font-semibold px-2 py-0.5 rounded-full ${PRIORITY_COLOR[t.priority]}`}>{t.priority}</span>
                      {t.deadline<todayStr&&<span className="text-xs font-semibold text-red-500">Overdue</span>}
                    </div>
                    <div className={`font-semibold text-sm mt-1 ${textPri}`}>{t.title}</div>
                    <div className={`text-xs mt-0.5 flex items-center gap-1 ${textMut}`}><Icons.Clock size={11}/> Due {fmtS(new Date(t.deadline+"T00:00:00"))}</div>
                  </div>
                  <button onClick={()=>setDismissed(da=>[...da,t.id])} className={`ml-4 mt-0.5 ${textMut} hover:text-red-400`}><Icons.X size={15}/></button>
                </div>
              ))}
            </div>
          }
          <h2 className={`font-semibold text-sm mt-6 mb-3 ${textPri}`}>Today's Schedule</h2>
          <div className={`${surface} rounded-2xl border ${border} p-4`}>
            {dueToday.filter(t=>t.time).length===0
              ?<p className={`text-sm text-center py-3 ${textSec}`}>No scheduled tasks. <button onClick={()=>setSection("myday")} className="text-indigo-500 hover:underline">Plan your day →</button></p>
              :<div className="flex flex-col gap-2">
                {dueToday.filter(t=>t.time).sort((a,b)=>a.time>b.time?1:-1).map(t=>(
                  <div key={t.id} className={`flex items-center gap-3 p-2 rounded-xl ${hov}`}>
                    <span className={`text-xs font-mono w-12 shrink-0 ${textMut}`}>{t.time}</span>
                    <div className={`w-1.5 h-1.5 rounded-full shrink-0 ${PRIORITY_DOT[t.priority]}`}/>
                    <span className={`text-sm font-medium ${textPri}`}>{t.title}</span>
                    <span className={`ml-auto text-xs ${textMut}`}>{t.category}</span>
                  </div>
                ))}
              </div>
            }
          </div>
        </div>
        <div className="flex flex-col gap-5">
          <div className={`${surface} rounded-2xl border ${border} p-5`}>
            <h2 className={`font-semibold text-sm mb-4 ${textPri}`}>Today's Progress</h2>
            <div className="flex flex-col items-center">
              <ProgressRing pct={pct}/>
              <p className={`text-xs mt-3 ${textMut}`}>{compToday}/{totToday} tasks completed</p>
            </div>
          </div>
          <div className={`${surface} rounded-2xl border ${border} p-5 flex-1`}>
            <h2 className={`font-semibold text-sm mb-3 ${textPri}`}>Quick Notes</h2>
            {note
              ?<div>
                <div className={`text-sm font-semibold mb-2 ${textPri}`}>{note.title}</div>
                {note.content.slice(0,3).map((b,i)=>(
                  <div key={i} className={`text-xs mb-1 leading-relaxed ${textSec}`}>
                    {b.type==="bullet"&&<span>• {b.text}</span>}
                    {b.type==="p"&&<span>{b.text}</span>}
                    {(b.type==="h2"||b.type==="h3")&&<span className={`font-semibold ${textPri}`}>{b.text}</span>}
                  </div>
                ))}
              </div>
              :<p className={`text-xs ${textMut}`}>No notes yet.</p>
            }
          </div>
        </div>
      </div>
    </div>
  );
}

function ProgressRing({pct}) {
  const r=36,c=2*Math.PI*r,dash=c*(pct/100);
  return(
    <svg width="90" height="90" viewBox="0 0 90 90">
      <circle cx="45" cy="45" r={r} fill="none" stroke="#e2e8f0" strokeWidth="8"/>
      <circle cx="45" cy="45" r={r} fill="none" stroke="#6366f1" strokeWidth="8" strokeDasharray={`${dash} ${c}`} strokeLinecap="round" transform="rotate(-90 45 45)"/>
      <text x="45" y="50" textAnchor="middle" fontSize="16" fontWeight="700" fill="#6366f1">{pct}%</text>
    </svg>
  );
}

// ── Task Board ──
function TaskBoard({tasks,allTasks,setTasks,projects,filterP,setFilterP,moveTask,toggleDone,deleteTask,setEditTask,deleteProject,setEditProject,setShowProj,dk}) {
  const {d,surface,border,textPri,textSec,textMut,hov} = dk;
  const [dragId,setDragId] = useState(null);
  const [overProj,setOverProj] = useState(null);
  const [quickProj,setQuickProj] = useState(null);
  const [quickTitle,setQuickTitle] = useState("");
  const byProj = pid => tasks.filter(t=>t.project===pid);
  const unassigned = tasks.filter(t=>!t.project||!projects.find(p=>p.id===t.project));

  const doQuickAdd = (pid) => {
    if(!quickTitle.trim()){setQuickProj(null);return;}
    const project = pid==="unassigned"?null:pid;
    setTasks(ts=>[...ts,{id:Date.now(),title:quickTitle.trim(),desc:"",deadline:ds(today),priority:"Medium",status:"To Do",category:"Work",project,done:false,time:""}]);
    setQuickProj(null); setQuickTitle("");
  };

  return(
    <div className="p-7 h-full flex flex-col">
      <div className="flex items-center justify-between mb-5">
        <div>
          <h1 className={`text-xl font-bold ${textPri}`}>Task Board</h1>
          <p className={`text-sm mt-0.5 ${textSec}`}>{allTasks.filter(t=>!t.done).length} active tasks · {projects.length} projects</p>
        </div>
        <div className="flex items-center gap-3">
          <div className={`flex items-center gap-2 ${surface} border ${border} rounded-xl px-3 py-2`}>
            <Icons.Filter size={14} className={textMut}/>
            <select value={filterP} onChange={e=>setFilterP(e.target.value)} className={`text-sm bg-transparent outline-none ${textPri}`}>
              <option>All</option>{PRIORITIES.map(p=><option key={p}>{p}</option>)}
            </select>
          </div>
          <button onClick={()=>setShowProj(true)} className={`flex items-center gap-2 ${surface} ${hov} border ${border} ${textPri} text-sm font-medium px-4 py-2 rounded-xl transition-colors`}><Icons.Plus size={15}/>New Project</button>
        </div>
      </div>
      <div className="flex gap-4 flex-1 overflow-x-auto pb-2">
        {projects.map(proj=>{
          const ptasks=byProj(proj.id);
          const done=ptasks.filter(t=>t.done).length;
          const pct=ptasks.length?Math.round(done/ptasks.length*100):0;
          return(
            <div key={proj.id}
              className={`flex flex-col rounded-2xl border min-w-72 w-80 shrink-0 overflow-hidden ${d?"bg-slate-900":"bg-white"} shadow-sm transition-all ${overProj===proj.id?"ring-2 ring-indigo-400 border-indigo-300":border}`}
              onDragOver={e=>{e.preventDefault();setOverProj(proj.id);}}
              onDragLeave={()=>setOverProj(null)}
              onDrop={e=>{e.preventDefault();if(dragId)moveTask(dragId,proj.id);setOverProj(null);setDragId(null);}}>
              <div className={`p-4 border-b ${border}`}>
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center gap-2">
                    <span className={`w-3 h-3 rounded-full ${PROJ_COLORS[proj.colorIdx%PROJ_COLORS.length]}`}/>
                    <span className={`text-sm font-bold ${textPri}`}>{proj.name}</span>
                  </div>
                  <div className="flex items-center gap-1">
                    <span className={`text-xs font-medium ${textMut} ${d?"bg-slate-800":"bg-slate-100"} rounded-full px-2 py-0.5`}>{ptasks.length}</span>
                    <button onClick={()=>setEditProject(proj)} className="text-slate-400 hover:text-indigo-400 p-0.5 ml-1"><Icons.Edit3 size={13}/></button>
                    <button onClick={()=>deleteProject(proj.id)} className="text-slate-400 hover:text-red-400 p-0.5"><Icons.Trash2 size={13}/></button>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <div className={`flex-1 h-1.5 ${d?"bg-slate-800":"bg-slate-100"} rounded-full overflow-hidden`}>
                    <div className={`h-full rounded-full ${PROJ_COLORS[proj.colorIdx%PROJ_COLORS.length]}`} style={{width:`${pct}%`}}/>
                  </div>
                  <span className={`text-xs font-medium w-8 text-right ${textMut}`}>{pct}%</span>
                </div>
              </div>
              <div className={`flex flex-col gap-2 flex-1 overflow-y-auto p-3 ${d?"bg-slate-900":""}`}>
                {ptasks.length===0&&<div className={`flex flex-col items-center justify-center py-6 ${textMut}`}><Icons.Circle size={22} className="mb-2 opacity-30"/><p className="text-xs">No tasks yet</p></div>}
                {ptasks.map(t=><TaskCard key={t.id} task={t} projects={projects} dk={dk} onDragStart={()=>setDragId(t.id)} onDragEnd={()=>setDragId(null)} onToggle={()=>toggleDone(t.id)} onEdit={()=>setEditTask(t)} onDelete={()=>deleteTask(t.id)}/>)}
                {quickProj===proj.id
                  ?<div className={`flex items-center gap-2 mt-1 p-2 rounded-xl border ${d?"border-slate-700 bg-slate-800":"border-slate-200 bg-slate-50"}`}>
                    <input autoFocus value={quickTitle} onChange={e=>setQuickTitle(e.target.value)}
                      onKeyDown={e=>{if(e.key==="Enter")doQuickAdd(proj.id);if(e.key==="Escape"){setQuickProj(null);setQuickTitle("");}}}
                      placeholder="Task name… Enter to add"
                      className={`flex-1 text-sm bg-transparent outline-none ${d?"text-slate-100 placeholder-slate-500":"text-slate-700 placeholder-slate-400"}`}/>
                    <button onClick={()=>doQuickAdd(proj.id)} className="text-indigo-500 hover:text-indigo-400 text-xs font-medium px-1">Add</button>
                    <button onClick={()=>{setQuickProj(null);setQuickTitle("");}} className={`${textMut} hover:text-red-400`}><Icons.X size={13}/></button>
                  </div>
                  :<button onClick={()=>{setQuickProj(proj.id);setQuickTitle("");}}
                    className={`flex items-center gap-2 w-full px-2 py-2 rounded-xl text-xs font-medium transition-colors mt-1 ${d?"text-slate-500 hover:bg-slate-800 hover:text-slate-300":"text-slate-400 hover:bg-slate-50 hover:text-slate-600"}`}>
                    <Icons.Plus size={13}/> Add task
                  </button>
                }
              </div>
            </div>
          );
        })}
        <div className={`flex flex-col rounded-2xl border-2 border-dashed ${d?"border-slate-700 bg-slate-900":"border-slate-300 bg-slate-50"} min-w-72 w-80 shrink-0 overflow-hidden`}>
          <div className={`p-4 border-b ${border}`}>
            <div className="flex items-center gap-2">
              <span className="w-3 h-3 rounded-full bg-slate-400"/>
              <span className={`text-sm font-bold ${textSec}`}>Unassigned</span>
              <span className={`ml-auto text-xs font-medium ${textMut} ${d?"bg-slate-800":"bg-white"} rounded-full px-2 py-0.5 border ${border}`}>{unassigned.length}</span>
            </div>
          </div>
          <div className={`flex flex-col gap-2 p-3 overflow-y-auto flex-1 ${d?"bg-slate-900":""}`}>
            {unassigned.map(t=><TaskCard key={t.id} task={t} projects={projects} dk={dk} onDragStart={()=>setDragId(t.id)} onDragEnd={()=>setDragId(null)} onToggle={()=>toggleDone(t.id)} onEdit={()=>setEditTask(t)} onDelete={()=>deleteTask(t.id)}/>)}
            {quickProj==="unassigned"
              ?<div className={`flex items-center gap-2 mt-1 p-2 rounded-xl border ${d?"border-slate-700 bg-slate-800":"border-slate-200 bg-slate-50"}`}>
                <input autoFocus value={quickTitle} onChange={e=>setQuickTitle(e.target.value)}
                  onKeyDown={e=>{if(e.key==="Enter")doQuickAdd("unassigned");if(e.key==="Escape"){setQuickProj(null);setQuickTitle("");}}}
                  placeholder="Task name… Enter to add"
                  className={`flex-1 text-sm bg-transparent outline-none ${d?"text-slate-100 placeholder-slate-500":"text-slate-700 placeholder-slate-400"}`}/>
                <button onClick={()=>doQuickAdd("unassigned")} className="text-indigo-500 hover:text-indigo-400 text-xs font-medium px-1">Add</button>
                <button onClick={()=>{setQuickProj(null);setQuickTitle("");}} className={`${textMut} hover:text-red-400`}><Icons.X size={13}/></button>
              </div>
              :<button onClick={()=>{setQuickProj("unassigned");setQuickTitle("");}}
                className={`flex items-center gap-2 w-full px-2 py-2 rounded-xl text-xs font-medium transition-colors mt-1 ${d?"text-slate-500 hover:bg-slate-800 hover:text-slate-300":"text-slate-400 hover:bg-slate-100 hover:text-slate-600"}`}>
                <Icons.Plus size={13}/> Add task
              </button>
            }
          </div>
        </div>
        <button onClick={()=>setShowProj(true)}
          className={`flex flex-col items-center justify-center min-w-48 w-56 shrink-0 rounded-2xl border-2 border-dashed ${d?"border-slate-700 hover:border-indigo-500 text-slate-500 hover:text-indigo-400":"border-slate-200 hover:border-indigo-300 hover:bg-indigo-50 text-slate-400 hover:text-indigo-500"} transition-all p-8 gap-2`}>
          <Icons.Plus size={20}/><span className="text-sm font-medium">New Project</span>
        </button>
      </div>
    </div>
  );
}

function TaskCard({task,projects,onDragStart,onDragEnd,onToggle,onEdit,onDelete,dk}) {
  const {d,textPri,textMut} = dk;
  const [hov,setHov]=useState(false);
  const isOverdue=task.deadline<todayStr&&!task.done;
  return(
    <div draggable onDragStart={onDragStart} onDragEnd={onDragEnd}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      className={`${d?"bg-slate-800 border-slate-700":"bg-white border-slate-100"} rounded-xl border p-3 cursor-grab active:cursor-grabbing shadow-sm hover:shadow-md transition-all select-none`}>
      <div className="flex items-start justify-between gap-2 mb-2">
        <button onClick={onToggle} className="mt-0.5 shrink-0 text-slate-400 hover:text-emerald-500">{task.done?<Icons.CheckCircle2 size={16} className="text-emerald-500"/>:<Icons.Circle size={16}/>}</button>
        <span className={`text-sm font-medium leading-snug flex-1 ${task.done?"line-through opacity-40":textPri}`}>{task.title}</span>
        {hov&&<div className="flex gap-1 shrink-0">
          <button onClick={onEdit} className="text-slate-400 hover:text-indigo-400"><Icons.Edit3 size={13}/></button>
          <button onClick={onDelete} className="text-slate-400 hover:text-red-400"><Icons.Trash2 size={13}/></button>
        </div>}
      </div>
      {task.desc&&<p className={`text-xs mb-2 leading-relaxed line-clamp-2 pl-6 ${textMut}`}>{task.desc}</p>}
      <div className="flex items-center gap-1.5 flex-wrap pl-6">
        <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${PRIORITY_COLOR[task.priority]}`}>{task.priority}</span>
        <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${task.status==="Done"?"bg-emerald-100 text-emerald-700":task.status==="In Progress"?"bg-blue-100 text-blue-700":task.status==="Waiting"?"bg-amber-100 text-amber-700":d?"bg-slate-700 text-slate-300":"bg-slate-100 text-slate-600"}`}>{task.status}</span>
        {isOverdue&&<span className="text-xs text-red-500 font-semibold flex items-center gap-0.5"><Icons.AlertCircle size={10}/>Overdue</span>}
        {task.deadline&&!isOverdue&&<span className={`text-xs flex items-center gap-0.5 ml-auto ${textMut}`}><Icons.Clock size={10}/>{fmtS(new Date(task.deadline+"T00:00:00"))}</span>}
      </div>
    </div>
  );
}

// ── Task Modal ──
function TaskModal({task,onSave,onClose,projects,dk}) {
  const {d,surface,textPri,textSec,textMut} = dk;
  const isNew = !task || task._new;
  const [form,setForm]=useState({title:(!task?._new&&task?.title)||(task?._new&&task?.title)||"",desc:(!task?._new&&task?.desc)||"",deadline:(!task?._new&&task?.deadline)||todayStr,priority:(!task?._new&&task?.priority)||"Medium",status:(!task?._new&&task?.status)||"To Do",category:(!task?._new&&task?.category)||"Work",time:(!task?._new&&task?.time)||"",project:task?.project||projects[0]?.id||""});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const iCls=`w-full border rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-400 ${d?"border-slate-700 bg-slate-800 text-slate-100 placeholder-slate-500":"border-slate-200 bg-white text-slate-700"}`;
  const sCls=`w-full border rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-400 ${d?"border-slate-700 bg-slate-800 text-slate-100":"border-slate-200 bg-white text-slate-700"}`;
  return(
    <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50" onClick={onClose}>
      <div className={`${surface} rounded-2xl shadow-2xl w-full max-w-lg p-6`} onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-5">
          <h2 className={`text-lg font-bold ${textPri}`}>{isNew?"New Task":"Edit Task"}</h2>
          <button onClick={onClose} className={`${textMut} hover:text-red-400`}><Icons.X size={18}/></button>
        </div>
        <div className="flex flex-col gap-4">
          <div><label className={`text-xs font-semibold uppercase tracking-wide mb-1 block ${textSec}`}>Title</label><input value={form.title} onChange={e=>set("title",e.target.value)} placeholder="Task title…" className={iCls} autoFocus/></div>
          <div><label className={`text-xs font-semibold uppercase tracking-wide mb-1 block ${textSec}`}>Description</label><textarea value={form.desc} onChange={e=>set("desc",e.target.value)} rows={2} placeholder="Optional…" className={`${iCls} resize-none`}/></div>
          <div><label className={`text-xs font-semibold uppercase tracking-wide mb-1 block ${textSec}`}>Project</label>
            <select value={form.project} onChange={e=>set("project",e.target.value)} className={sCls}>
              <option value="">— No Project —</option>{projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>
          <div className="grid grid-cols-2 gap-4">
            <div><label className={`text-xs font-semibold uppercase tracking-wide mb-1 block ${textSec}`}>Deadline</label><input type="date" value={form.deadline} onChange={e=>set("deadline",e.target.value)} className={iCls}/></div>
            <div><label className={`text-xs font-semibold uppercase tracking-wide mb-1 block ${textSec}`}>Time</label><input type="time" value={form.time} onChange={e=>set("time",e.target.value)} className={iCls}/></div>
          </div>
          <div className="grid grid-cols-3 gap-4">
            {[["Priority","priority",PRIORITIES],["Status","status",STATUS_OPTS],["Category","category",CATEGORIES]].map(([lbl,key,opts])=>(
              <div key={key}><label className={`text-xs font-semibold uppercase tracking-wide mb-1 block ${textSec}`}>{lbl}</label>
                <select value={form[key]} onChange={e=>set(key,e.target.value)} className={sCls}>{opts.map(o=><option key={o}>{o}</option>)}</select>
              </div>
            ))}
          </div>
        </div>
        <div className="flex justify-end gap-3 mt-6">
          <button onClick={onClose} className={`px-4 py-2 rounded-xl text-sm font-medium ${textSec} ${d?"hover:bg-slate-800":"hover:bg-slate-100"} transition-colors`}>Cancel</button>
          <button onClick={()=>form.title&&onSave(form)} className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium">{isNew?"Create Task":"Save Changes"}</button>
        </div>
      </div>
    </div>
  );
}

function ProjectModal({project,onSave,onClose,dk}) {
  const {d,surface,textPri,textSec,textMut} = dk;
  const [name,setName]=useState(project?.name||"");
  const [colorIdx,setColorIdx]=useState(project?.colorIdx??0);
  return(
    <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50" onClick={onClose}>
      <div className={`${surface} rounded-2xl shadow-2xl w-full max-w-sm p-6`} onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-5">
          <h2 className={`text-lg font-bold ${textPri}`}>{project?"Edit Project":"New Project"}</h2>
          <button onClick={onClose} className={`${textMut} hover:text-red-400`}><Icons.X size={18}/></button>
        </div>
        <div className="flex flex-col gap-4">
          <div><label className={`text-xs font-semibold uppercase tracking-wide mb-1 block ${textSec}`}>Project Name</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Product Launch" autoFocus
              className={`w-full border rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-400 ${d?"border-slate-700 bg-slate-800 text-slate-100 placeholder-slate-500":"border-slate-200 bg-white text-slate-700"}`}/>
          </div>
          <div><label className={`text-xs font-semibold uppercase tracking-wide mb-2 block ${textSec}`}>Color</label>
            <div className="flex gap-2 flex-wrap">{PROJ_COLORS.map((c,i)=><button key={i} onClick={()=>setColorIdx(i)} className={`w-7 h-7 rounded-full ${c} transition-all ${colorIdx===i?"ring-2 ring-offset-2 ring-indigo-400 scale-110":""}`}/>)}</div>
          </div>
        </div>
        <div className="flex justify-end gap-3 mt-6">
          <button onClick={onClose} className={`px-4 py-2 rounded-xl text-sm ${textSec} ${d?"hover:bg-slate-800":"hover:bg-slate-100"} transition-colors`}>Cancel</button>
          <button onClick={()=>name.trim()&&onSave(name.trim(),colorIdx)} className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium">{project?"Save Changes":"Create Project"}</button>
        </div>
      </div>
    </div>
  );
}

// ── My Day (Google Calendar style) ──
function MyDay({tasks,setTasks,calDate,setCalDate,calStr,updateTaskTime,updateTaskDuration,unscheduleTask,projects,toggleDone,setEditTask,dk}) {
  const {d,surface,border,textPri,textSec,textMut,hov} = dk;
  const isToday = calStr === todayStr;
  const gridRef = useRef(null);

  // Tasks for this day
  const dayTasks = tasks.filter(t => t.deadline === calStr);
  const scheduledTasks = dayTasks.filter(t => t.time && !t.done);
  const unscheduledTasks = dayTasks.filter(t => !t.time && !t.done);

  // Drag state — handles both moving and resizing
  // mode: "move" | "resize-bottom" | null
  const [drag, setDrag] = useState(null); // {id, mode, startY, originalTime, originalDur}
  const [hovInfo, setHovInfo] = useState(null); // {taskId, mode, hour, dur} preview during drag
  const [extDragOver, setExtDragOver] = useState(null); // hour from external dnd

  // Quick add inline
  const [quickAdd, setQuickAdd] = useState(null);
  const [quickTitle, setQuickTitle] = useState("");

  const hourIdx = h => HOURS.indexOf(h);
  const hourFromIdx = i => i>=0 && i<HOURS.length ? HOURS[i] : null;
  const getDur = t => Math.max(1, Math.min(16, t.duration || 1));

  // Compute snap from absolute Y position within grid
  const ySnapHour = (clientY) => {
    if(!gridRef.current) return null;
    const rect = gridRef.current.getBoundingClientRect();
    const relY = clientY - rect.top;
    const idx = Math.max(0, Math.min(HOURS.length-1, Math.floor(relY / SLOT_H)));
    return HOURS[idx];
  };
  const ySlotsFromTop = (clientY, fromHour) => {
    if(!gridRef.current) return 1;
    const rect = gridRef.current.getBoundingClientRect();
    const relY = clientY - rect.top;
    const fromIdx = hourIdx(fromHour);
    const slots = Math.round(relY / SLOT_H) - fromIdx;
    return Math.max(1, Math.min(HOURS.length - fromIdx, slots));
  };

  // ── Begin internal drag (move or resize) ──
  const startInternalDrag = (e, task, mode) => {
    e.preventDefault();
    e.stopPropagation();
    const startY = e.clientY;
    const originalTime = task.time;
    const originalDur = getDur(task);
    setDrag({ id: task.id, mode, startY, originalTime, originalDur });

    let lastUpdate = { time: originalTime, dur: originalDur };

    const onMove = ev => {
      ev.preventDefault();
      if(mode === "move") {
        const newHour = ySnapHour(ev.clientY - (SLOT_H / 4)); // grab roughly from card top
        if(newHour && newHour !== lastUpdate.time) {
          // Make sure the task fits within the day
          const idx = hourIdx(newHour);
          if(idx + originalDur <= HOURS.length) {
            lastUpdate.time = newHour;
            setHovInfo({ taskId: task.id, mode, hour: newHour, dur: originalDur });
          }
        }
      } else if(mode === "resize-bottom") {
        const startIdx = hourIdx(originalTime);
        const newSlots = ySlotsFromTop(ev.clientY, originalTime);
        const newDur = Math.max(1, Math.min(HOURS.length - startIdx, newSlots));
        if(newDur !== lastUpdate.dur) {
          lastUpdate.dur = newDur;
          setHovInfo({ taskId: task.id, mode, hour: originalTime, dur: newDur });
        }
      }
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      // Commit
      if(mode === "move" && lastUpdate.time !== originalTime) {
        updateTaskTime(task.id, lastUpdate.time);
      } else if(mode === "resize-bottom" && lastUpdate.dur !== originalDur) {
        updateTaskDuration(task.id, lastUpdate.dur);
      }
      setDrag(null);
      setHovInfo(null);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };

  // External drop (from unscheduled panel)
  const onExtDragOver = (e, hour) => {
    e.preventDefault();
    setExtDragOver(hour);
  };
  const onExtDrop = (e, hour) => {
    e.preventDefault();
    const tid = e.dataTransfer.getData("text/plain");
    if(tid) {
      const id = parseInt(tid);
      updateTaskTime(id, hour);
    }
    setExtDragOver(null);
  };

  const doQuickAdd = (hour) => {
    if(!quickTitle.trim()){ setQuickAdd(null); return; }
    setTasks(ts=>[...ts, {id:Date.now(),title:quickTitle.trim(),desc:"",deadline:calStr,priority:"Medium",status:"To Do",category:"Work",project:null,time:hour,duration:1,done:false}]);
    setQuickAdd(null); setQuickTitle("");
  };

  // Compute display position for each scheduled task (with live preview from hovInfo)
  const taskDisplay = scheduledTasks.map(t => {
    const isDragging = drag?.id === t.id && hovInfo;
    const time = isDragging && hovInfo.mode === "move" ? hovInfo.hour : t.time;
    const dur  = isDragging && hovInfo.mode === "resize-bottom" ? hovInfo.dur : getDur(t);
    return { task: t, time, dur, isDragging: !!isDragging };
  });

  return(
    <div className={`p-7 h-full flex flex-col ${drag?"no-select":""}`}>
      <div className="flex items-center justify-between mb-5">
        <div>
          <h1 className={`text-xl font-bold ${textPri}`}>My Day</h1>
          <p className={`text-sm mt-0.5 ${textSec}`}>{fmt(calDate)}{isToday?" · Today":""}</p>
        </div>
        <div className={`flex items-center gap-1 rounded-xl border ${border} ${surface} p-1`}>
          <button onClick={()=>setCalDate(cv=>addDays(cv,-1))} className={`p-1.5 rounded-lg ${textSec} ${hov} transition-colors`}><Icons.ChevronLeft size={15}/></button>
          <button onClick={()=>setCalDate(new Date())}
            className={`px-3 py-1.5 text-xs font-medium rounded-lg transition-colors flex items-center gap-1 ${isToday?"bg-indigo-50 text-indigo-700":textSec}`}>
            <Icons.ChevronLeft size={11} className="opacity-40"/><span>Today</span><Icons.ChevronRight size={11} className="opacity-40"/>
          </button>
          <button onClick={()=>setCalDate(cv=>addDays(cv,1))} className={`p-1.5 rounded-lg ${textSec} ${hov} transition-colors`}><Icons.ChevronRight size={15}/></button>
        </div>
      </div>
      <div className="flex gap-5 flex-1 overflow-hidden">
        {/* Calendar grid */}
        <div className={`flex-1 rounded-2xl border overflow-y-auto ${surface} ${border}`}>
          <div className="flex">
            {/* Hour labels column */}
            <div className="w-14 shrink-0 pt-2">
              {HOURS.map(h => (
                <div key={h} className={`text-xs font-mono text-right pr-2 ${textMut}`} style={{height:`${SLOT_H}px`}}>{h}</div>
              ))}
            </div>
            {/* Slots / events area */}
            <div ref={gridRef} className="flex-1 relative">
              {/* Hour gridlines + drop targets */}
              {HOURS.map((hour, i) => {
                const isExtHov = extDragOver === hour;
                const isQA = quickAdd === hour;
                const hasTaskAtHour = taskDisplay.some(td => td.time === hour);
                return (
                  <div key={hour}
                    onDragOver={e=>onExtDragOver(e, hour)}
                    onDragLeave={()=>setExtDragOver(null)}
                    onDrop={e=>onExtDrop(e, hour)}
                    className={`border-b ${d?"border-slate-800":"border-slate-100"} relative group transition-colors ${isExtHov?(d?"bg-indigo-950":"bg-indigo-50/60"):""}`}
                    style={{height:`${SLOT_H}px`}}>
                    {/* Quick add inline (only if no task at this hour) */}
                    {!hasTaskAtHour && (
                      isQA
                        ?<div className="absolute inset-1 flex items-center gap-2 z-20">
                          <input autoFocus value={quickTitle} onChange={e=>setQuickTitle(e.target.value)}
                            onKeyDown={e=>{if(e.key==="Enter")doQuickAdd(hour);if(e.key==="Escape"){setQuickAdd(null);setQuickTitle("");}}}
                            placeholder="Task… Enter to save"
                            className={`flex-1 text-sm rounded-lg px-3 py-1.5 outline-none border focus:ring-2 focus:ring-indigo-300 ${d?"bg-slate-800 border-slate-600 text-white placeholder-slate-400":"bg-white border-indigo-300 text-slate-700 placeholder-slate-400"}`}/>
                          <button onClick={()=>doQuickAdd(hour)} className="text-indigo-400 hover:text-indigo-300 font-medium text-xs px-2">Add</button>
                          <button onClick={()=>{setQuickAdd(null);setQuickTitle("");}} className={`${textMut} hover:text-red-400`}><Icons.X size={13}/></button>
                        </div>
                        :<button onClick={()=>{setQuickAdd(hour);setQuickTitle("");}}
                          className={`absolute inset-1 flex items-center gap-1 px-2 rounded-lg text-xs opacity-0 group-hover:opacity-100 transition-opacity ${textMut} hover:text-indigo-500 ${d?"hover:bg-slate-800":"hover:bg-slate-50"}`}>
                          <Icons.Plus size={11}/>Add task
                        </button>
                    )}
                  </div>
                );
              })}
              {/* Scheduled task chips (absolutely positioned) */}
              {taskDisplay.map(({task, time, dur, isDragging}) => {
                const idx = hourIdx(time);
                if(idx < 0) return null;
                const top = idx * SLOT_H;
                const height = dur * SLOT_H;
                const proj = projects?.find(p => p.id === task.project);
                const endHourIdx = idx + dur;
                const endTime = endHourIdx < HOURS.length ? HOURS[endHourIdx] : "24:00";
                return (
                  <div key={task.id}
                    onMouseDown={e => {
                      // Only initiate move if clicking the body (not buttons or resize handle)
                      if(e.target.closest("button") || e.target.closest(".resize-handle")) return;
                      startInternalDrag(e, task, "move");
                    }}
                    className={`absolute left-1 right-2 rounded-xl px-3 py-2 select-none shadow-sm transition-shadow ${isDragging?"shadow-lg ring-2 ring-indigo-400 z-30":"z-10 hover:shadow-md"} ${d?"bg-indigo-950 text-indigo-200 border border-indigo-800":"bg-indigo-50 text-indigo-900 border border-indigo-200"} ${drag?.id===task.id?"cursor-grabbing":"cursor-grab"} group`}
                    style={{top:`${top+1}px`, height:`${height-2}px`, overflow:"hidden"}}>
                    <div className="flex items-start justify-between gap-2">
                      <div className="flex items-center gap-1.5 min-w-0 flex-1">
                        <button onMouseDown={e=>e.stopPropagation()} onClick={()=>toggleDone(task.id)} className="shrink-0 text-indigo-400 hover:text-emerald-400">
                          {task.done?<Icons.CheckCircle2 size={13} className="text-emerald-400"/>:<Icons.Circle size={13}/>}
                        </button>
                        <span className={`text-sm font-medium truncate ${task.done?"line-through opacity-50":""}`}>{task.title}</span>
                      </div>
                      <div className="flex items-center gap-1 shrink-0">
                        {proj && <span className={`text-xs px-1.5 py-0.5 rounded-full text-white font-medium whitespace-nowrap ${PROJ_COLORS[proj.colorIdx%PROJ_COLORS.length]}`}>{proj.name}</span>}
                        <div className="flex gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity">
                          <button onMouseDown={e=>e.stopPropagation()} onClick={()=>setEditTask(task)} className="p-0.5 rounded hover:bg-indigo-200/30"><Icons.Edit3 size={11}/></button>
                          <button onMouseDown={e=>e.stopPropagation()} onClick={()=>unscheduleTask(task.id)} className="p-0.5 rounded hover:bg-red-200/30 text-red-400"><Icons.X size={11}/></button>
                        </div>
                      </div>
                    </div>
                    <div className="text-xs opacity-60 pl-5 mt-0.5">{time} – {endTime} · {dur}h</div>
                    {/* Resize handle at bottom */}
                    <div
                      className={`resize-handle absolute bottom-0 left-0 right-0 h-2 cursor-ns-resize flex items-center justify-center ${d?"hover:bg-indigo-800":"hover:bg-indigo-200"} rounded-b-xl transition-colors`}
                      onMouseDown={e => startInternalDrag(e, task, "resize-bottom")}>
                      <div className={`w-10 h-1 rounded-full opacity-0 group-hover:opacity-100 transition-opacity ${d?"bg-indigo-400":"bg-indigo-400"}`}/>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
        {/* Unscheduled panel */}
        <div className="w-64 shrink-0 flex flex-col gap-3">
          <h3 className={`text-sm font-semibold ${textPri}`}>Unscheduled</h3>
          <p className={`text-xs -mt-2 ${textMut}`}>Drag onto the timeline</p>
          {unscheduledTasks.length===0
            ?<div className={`${surface} rounded-2xl border ${border} p-6 text-center`}>
              <Icons.Coffee size={22} className={`mx-auto mb-2 ${textMut}`}/>
              <p className={`text-xs ${textMut}`}>Nothing to schedule!</p>
            </div>
            :<div className="flex flex-col gap-2 overflow-y-auto">
              {unscheduledTasks.map(t=>(
                <div key={t.id} draggable
                  onDragStart={e=>{ e.dataTransfer.setData("text/plain", String(t.id)); e.dataTransfer.effectAllowed="move"; }}
                  className={`${d?"bg-slate-800 border-slate-700":"bg-white border-slate-200"} border rounded-xl p-3 cursor-grab hover:shadow-md transition-all select-none`}>
                  <div className="flex items-center gap-2 mb-1">
                    <div className={`w-2 h-2 rounded-full shrink-0 ${PRIORITY_DOT[t.priority]}`}/>
                    <span className={`text-sm font-medium leading-snug ${textPri}`}>{t.title}</span>
                  </div>
                  <span className={`text-xs px-1.5 py-0.5 rounded-full ml-4 ${PRIORITY_COLOR[t.priority]}`}>{t.priority}</span>
                  <p className={`text-xs mt-1.5 ml-4 flex items-center gap-1 ${textMut}`}><Icons.Calendar size={10}/>Drag to schedule</p>
                </div>
              ))}
            </div>
          }
        </div>
      </div>
    </div>
  );
}

// ── Notes ──
function Notes({notes,selNote,setSelNote,addNote,deleteNote,toggleFav,setNotes,dk}) {
  const {d,surface,border,textPri,textSec,textMut} = dk;
  const note=notes.find(n=>n.id===selNote);
  const updTitle=(id,v)=>setNotes(ns=>ns.map(n=>n.id===id?{...n,title:v}:n));
  const updBlock=(id,i,v)=>setNotes(ns=>ns.map(n=>n.id===id?{...n,content:n.content.map((b,j)=>j===i?{...b,text:v}:b)}:n));
  const togCheck=(id,i)=>setNotes(ns=>ns.map(n=>n.id===id?{...n,content:n.content.map((b,j)=>j===i?{...b,checked:!b.checked}:b)}:n));
  return(
    <div className="flex h-full overflow-hidden">
      <div className={`w-64 ${d?"bg-slate-900 border-slate-700":"bg-white border-slate-100"} border-r flex flex-col p-4 shrink-0`}>
        <div className="flex items-center justify-between mb-4">
          <h2 className={`font-bold text-sm ${textPri}`}>Notes</h2>
          <button onClick={addNote} className={`p-1.5 rounded-lg ${d?"bg-indigo-950 text-indigo-400 hover:bg-indigo-900":"bg-indigo-50 text-indigo-600 hover:bg-indigo-100"} transition-colors`}><Icons.Plus size={15}/></button>
        </div>
        <div className="flex flex-col gap-1 overflow-y-auto flex-1">
          {notes.filter(n=>n.fav).length>0&&(
            <div className="mb-2">
              <p className={`text-xs font-semibold uppercase tracking-wide mb-1 px-2 ${textMut}`}>Favorites</p>
              {notes.filter(n=>n.fav).map(n=><NoteItem key={n.id} note={n} sel={selNote===n.id} onSel={()=>setSelNote(n.id)} onFav={()=>toggleFav(n.id)} onDel={()=>deleteNote(n.id)} dk={dk}/>)}
            </div>
          )}
          <p className={`text-xs font-semibold uppercase tracking-wide mb-1 px-2 ${textMut}`}>All Notes</p>
          {notes.filter(n=>!n.fav).map(n=><NoteItem key={n.id} note={n} sel={selNote===n.id} onSel={()=>setSelNote(n.id)} onFav={()=>toggleFav(n.id)} onDel={()=>deleteNote(n.id)} dk={dk}/>)}
          {notes.length===0&&<p className={`text-xs px-2 ${textMut}`}>No notes yet.</p>}
        </div>
      </div>
      <div className={`flex-1 overflow-y-auto p-8 ${d?"bg-slate-950":"bg-slate-50"}`}>
        {!note
          ?<div className="flex flex-col items-center justify-center h-full">
            <Icons.BookOpen size={36} className={`mb-3 opacity-40 ${textMut}`}/>
            <p className={`font-medium ${textSec}`}>Select a note or create one</p>
          </div>
          :<div className="max-w-2xl mx-auto">
            <input value={note.title} onChange={e=>updTitle(note.id,e.target.value)}
              className={`w-full text-3xl font-bold bg-transparent outline-none mb-6 ${d?"text-slate-100 placeholder-slate-600":"text-slate-800 placeholder-slate-300"}`} placeholder="Untitled"/>
            <div className="flex flex-col gap-2">
              {note.content.map((b,i)=><NoteBlock key={i} block={b} onChange={v=>updBlock(note.id,i,v)} onCheck={()=>togCheck(note.id,i)} dk={dk}/>)}
            </div>
            <button onClick={()=>setNotes(ns=>ns.map(n=>n.id===note.id?{...n,content:[...n.content,{type:"p",text:""}]}:n))}
              className={`mt-4 text-sm flex items-center gap-1 ${textMut} hover:text-indigo-400`}><Icons.Plus size={14}/>Add block</button>
          </div>
        }
      </div>
    </div>
  );
}

function NoteItem({note,sel,onSel,onFav,onDel,dk}) {
  const {d,textMut} = dk;
  const [hov,setHov]=useState(false);
  return(
    <div onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} onClick={onSel}
      className={`flex items-center gap-2 px-2 py-2.5 rounded-xl cursor-pointer transition-all ${sel?(d?"bg-indigo-900 text-indigo-300":"bg-indigo-50 text-indigo-700"):(d?"hover:bg-slate-800 text-slate-400":"hover:bg-slate-50 text-slate-600")}`}>
      <Icons.FileText size={14} className="shrink-0"/>
      <span className="text-sm font-medium flex-1 truncate">{note.title}</span>
      {hov&&<div className="flex gap-1">
        <button onClick={e=>{e.stopPropagation();onFav();}} className={`${note.fav?"text-amber-400":"text-slate-300 hover:text-amber-400"}`}><Icons.Star size={12}/></button>
        <button onClick={e=>{e.stopPropagation();onDel();}} className="text-slate-300 hover:text-red-400"><Icons.Trash2 size={12}/></button>
      </div>}
    </div>
  );
}

function NoteBlock({block,onChange,onCheck,dk}) {
  const {d} = dk;
  const base=`w-full bg-transparent outline-none resize-none ${d?"text-slate-200":"text-slate-700"}`;
  if(block.type==="h2") return <input value={block.text} onChange={e=>onChange(e.target.value)} className={`${base} text-2xl font-bold border-b ${d?"border-slate-700":"border-slate-200"} pb-2 mb-1`}/>;
  if(block.type==="h3") return <input value={block.text} onChange={e=>onChange(e.target.value)} className={`${base} text-lg font-semibold`}/>;
  if(block.type==="bullet") return <div className="flex items-start gap-2"><span className={`mt-1.5 shrink-0 ${d?"text-slate-500":"text-slate-400"}`}>•</span><input value={block.text} onChange={e=>onChange(e.target.value)} className={`${base} text-sm leading-relaxed`}/></div>;
  if(block.type==="check") return(
    <div className="flex items-center gap-2">
      <button onClick={onCheck} className="shrink-0">{block.checked?<Icons.CheckCircle2 size={16} className="text-emerald-500"/>:<Icons.Circle size={16} className={d?"text-slate-500":"text-slate-300"}/>}</button>
      <input value={block.text} onChange={e=>onChange(e.target.value)} className={`${base} text-sm ${block.checked?"line-through opacity-40":""}`}/>
    </div>
  );
  return <textarea value={block.text} onChange={e=>onChange(e.target.value)} rows={2} className={`${base} text-sm leading-relaxed`}/>;
}

// ── Settings ──
function SettingsPage({theme,setTheme,userName,setUserName,dk}) {
  const {d,surface,border,textPri,textSec,textMut} = dk;
  const [notif,setNotif]=useState(true);
  return(
    <div className="p-7 max-w-2xl">
      <h1 className={`text-xl font-bold mb-6 ${textPri}`}>Settings</h1>
      {[
        {label:"Profile",body:(
          <div><label className={`text-xs font-semibold uppercase tracking-wide block mb-1 ${textSec}`}>Display Name</label>
            <input value={userName} onChange={e=>setUserName(e.target.value)} className={`border rounded-xl px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-300 w-full max-w-xs ${d?"border-slate-700 bg-slate-800 text-slate-100":"border-slate-200 bg-white text-slate-700"}`}/></div>
        )},
        {label:"Appearance",body:(
          <div className="flex flex-col gap-3">
            <div className="flex gap-3">
              {["Light","Dark","System"].map(t=>(
                <button key={t} onClick={()=>setTheme(t)} className={`px-4 py-2 rounded-xl text-sm font-medium border transition-colors ${theme===t?"bg-indigo-600 text-white border-indigo-600":d?"border-slate-600 text-slate-300 hover:bg-slate-800":"border-slate-200 text-slate-600 hover:bg-slate-50"}`}>{t}</button>
              ))}
            </div>
            <p className={`text-xs ${textMut}`}>Active: <span className="font-semibold">{theme}</span></p>
          </div>
        )},
        {label:"Notifications",body:(
          <div className="flex items-center gap-3">
            <span className={`text-sm ${textPri}`}>Enable deadline reminders</span>
            <button onClick={()=>setNotif(v=>!v)} className={`w-11 h-6 rounded-full transition-colors relative ${notif?"bg-indigo-600":"bg-slate-400"}`}>
              <span className={`absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all ${notif?"left-5":"left-0.5"}`}/>
            </button>
          </div>
        )},
      ].map(({label,body})=>(
        <div key={label} className={`${surface} rounded-2xl border ${border} p-5 mb-4`}>
          <h2 className={`font-semibold text-sm mb-4 ${textPri}`}>{label}</h2>{body}
        </div>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
